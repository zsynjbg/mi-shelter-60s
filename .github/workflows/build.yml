name: Build Xiaomi QuickApp RPK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Toolkit Globally and Locally
        run: |
          npm install -g @xiaomi/aiot-toolkit || npm install -g aiot-toolkit
          npm install

      - name: Run Build Command
        run: |
          npx aiot-toolkit build || npx aiot build || npm run build

      - name: Show All Files After Build
        run: |
          find . -maxdepth 4 -not -path '*/.*' -not -path './node_modules*'

      - name: Upload Everything
        uses: actions/upload-artifact@v4
        with:
          name: mi-shelter-rpk-package
          path: |
            .
            !node_information/
            !.git/
            !node_modules/
          if-no-files-found: error
